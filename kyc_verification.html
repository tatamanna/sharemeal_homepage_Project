<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KYC Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>

<body>
<div class="auth-container">
  <div class="auth-card">

    <h2 class="kyc-title">KYC Verification</h2>
    <p class="kyc-sub">Complete your verification</p>
    <p class="kyc-hint">
      Upload your University ID and NID/Birth Certificate to unlock features.
    </p>

    <div class="kyc-box">
      <div class="kyc-icon">
      <img src="icons/idcard.png">
      </div>
      <div class="kyc-text">
        <h4>Trade License</h4>
        <p>Upload Front / Back</p>
        <div class="kyc-bar"></div>
      </div>
    </div>
    

    <div class="kyc-box">
     <div class="kyc-icon">
      <img src="icons/page_icon.png">
      </div>
      <div class="kyc-text">
        <h4>eTIN</h4>
        <p>Upload Document</p>
        <div class="kyc-bar"></div>
      </div>
    </div>
    

    <button class="btn-primary">Submit for Verification</button>

  </div>
</div>
</body>
</html>
