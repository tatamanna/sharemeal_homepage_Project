<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShareMeal | Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">

</head>
<body>

<div class="auth-container">
  <div class="auth-card">

   <div class="brand-header">
  <img src="logo.png" class="brand-logo">

  <div class="brand-text">
    <h2>ShareMeal</h2>
    <p>Sign in to continue</p>
  </div>
</div>


    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="m@example.com">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="********">
      <a class="forgot">Forgot Password?</a>
    </div>

    <form action="choose_option.html">
       <button type="submit" class="btn-primary">Login</button>
    </form>


    <div class="divider">OR CONTINUE WITH</div>

    <div class="social">
  <a href="#" class="social-btn">
    <img src="icons/github-icon.png">
    <span>Github</span>
  </a>z

  <a href="#" class="social-btn">
    <img src="icons/google.png">
    <span>Google</span>
  </a>
</div>
   <p class="bottom-text">Don’t have an account?
     <a href="choose_option.html">Sign up</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script>lucide.createIcons();</script>
</body>
</html>
