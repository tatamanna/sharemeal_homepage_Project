<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Choose Role</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card choose-card">

    <div class="brand-header">
      <img src="logo.png" class="brand-logo">
      <div class="brand-text">
        <h2>ShareMeal</h2>
        <p>Select one to continue.</p>
      </div>
    </div>

    <div class="role-grid">

      <a href="register_asDonor.html" class="role-card active">
        <img src="icons/donor_logo.png">
        <h3>Donor</h3>
        <p>Provide food donations to support those in need</p>
      </a>

      <a href="register_asNGO.html" class="role-card">
        <img src="icons/NGO_logo.png">
        <h3>NGO</h3>
        <p>Manage and distribute donated food</p>
      </a>

      <a href="register_asVolunteer.html" class="role-card">
        <img src="icons/volunteer_logo.png">
        <h3>Volunteer</h3>
        <p>Help with collection and distribution of food</p>
      </a>

    </div>
  </div>
</div>

</body>
</html>
