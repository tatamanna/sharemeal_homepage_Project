<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register as Volunteer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <div class="brand-header">
      <img src="logo.png" class="brand-logo">
      <div class="brand-text">
        <h2>ShareMeal</h2>
        <p>Register as Volunteer</p>
      </div>
    </div>

    <div class="input-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your Email">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" placeholder="Enter your confirm password">
    </div>

    <div class="input-group">
      <label>Time Slots</label>
      <input type="text" placeholder="Select availability time slots">
    </div>

    <form action="otp_verification.html" method="get">
     
   <button type="submit" class="btn-primary">Sign Up</button>
    </form>

    <p class="bottom-text">
     Already have an account? 
    <a href="login_1.html">Sign In</a>
   </p>

  </div>
</div>

</body>
</html>
